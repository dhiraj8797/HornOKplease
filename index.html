<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>हॉर्न ओके प्लीज़ — Highway King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Oswald:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-asphalt:#3d0b10;
    --bg-asphalt2:#5c1119;
    --truck-yellow:#ffc93c;
    --truck-red:#ff4d5e;
    --truck-chrome:#e7c9cb;
    --neon-tube:#39ff9d;
    --rust-orange:#ff7a29;
    --text-light:#fdf3ee;
    --text-dim:#e3a8ad;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--bg-asphalt);
    color:var(--text-light);
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    min-height:100vh;
    height:100vh;
    position:relative;
    background:
      radial-gradient(ellipse 90% 50% at 80% 8%, #5a1018 0%, transparent 50%),
      radial-gradient(ellipse 120% 60% at 50% -10%, #7a1420 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-asphalt) 0%, var(--bg-asphalt2) 55%, #24060a 100%);
  }

  /* ---------- moon + richer sky ---------- */
  .moon{
    position:fixed; top:8vh; right:12vw; z-index:0; pointer-events:none;
    width:58px; height:58px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d6, #e8c97a 55%, #c9a04a 100%);
    box-shadow:0 0 40px rgba(255,230,160,.35), 0 0 80px rgba(255,200,100,.15);
    opacity:.9;
  }
  .moon::after{
    content:""; position:absolute; inset:8px 14px 18px 8px; border-radius:50%;
    background:radial-gradient(circle at 60% 40%, transparent 40%, rgba(61,11,16,.25) 70%);
  }
  .cloud{
    position:fixed; z-index:0; pointer-events:none;
    height:18px; border-radius:20px;
    background:rgba(255,220,200,.08);
    filter:blur(1px);
    animation:cloudDrift linear infinite;
  }
  .cloud.c1{ top:12vh; left:-10%; width:120px; animation-duration:80s; }
  .cloud.c2{ top:18vh; left:40%; width:90px; animation-duration:110s; opacity:.6; }
  .cloud.c3{ top:9vh; left:70%; width:140px; animation-duration:95s; opacity:.5; }
  @keyframes cloudDrift{
    from{ transform:translateX(0); }
    to{ transform:translateX(30vw); }
  }

  /* ---------- horizon + stars ---------- */
  .horizon{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(2px 2px at 20% 15%, #ffffff55, transparent),
      radial-gradient(1.5px 1.5px at 60% 8%, #ffffff40, transparent),
      radial-gradient(1.5px 1.5px at 80% 20%, #ffffff35, transparent),
      radial-gradient(1.5px 1.5px at 35% 25%, #ffffff30, transparent),
      radial-gradient(1.5px 1.5px at 90% 12%, #ffffff30, transparent);
  }

  /* ---------- scrolling roadside scenery ---------- */
  .scenery{
    position:fixed; left:0; right:0; bottom:26vh; height:48vh;
    z-index:1; pointer-events:none; overflow:hidden;
  }
  .scenery-track{
    position:absolute; left:0; bottom:0;
    display:flex; width:max-content;
    will-change:transform;
  }
  .layer-far{
    height:100%;
    animation:sceneryMove 55s linear infinite;
  }
  .layer-mid{
    height:72%;
    animation:sceneryMove 28s linear infinite;
  }
  .layer-near{
    height:88%;
    animation:sceneryMove 16s linear infinite;
  }
  /* Move right so left-facing truck feels like driving forward */
  @keyframes sceneryMove{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0); }
  }
  body.cruising .layer-far{ animation-duration:28s; }
  body.cruising .layer-mid{ animation-duration:14s; }
  body.cruising .layer-near{ animation-duration:8s; }

  /* apartments / buildings */
  .building{
    position:relative; align-self:flex-end;
    margin:0 14px 0 0;
    flex:none;
    background:linear-gradient(180deg, #2a1016 0%, #18080c 100%);
    border:1px solid #3a161c;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
  }
  .building::before{
    content:"";
    position:absolute; inset:8px 6px 10px;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 10px, rgba(255,210,120,.18) 10px 14px),
      repeating-linear-gradient(180deg, transparent 0 12px, rgba(255,210,120,.14) 12px 16px);
    opacity:.8;
  }
  .building.lit::before{ opacity:1; filter:drop-shadow(0 0 4px rgba(255,200,100,.25)); }

  /* tower block */
  .building.tower{
    width:42px; height:86%;
    background:linear-gradient(180deg,#241820,#12080c);
    border-color:#4a2830;
  }
  .building.tower::before{
    inset:6px 5px 8px;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 7px, rgba(160,210,255,.22) 7px 11px),
      repeating-linear-gradient(180deg, transparent 0 9px, rgba(160,210,255,.16) 9px 12px);
  }

  /* walk-up apartment with balconies */
  .building.walkup{
    width:52px; height:68%;
    background:linear-gradient(180deg,#3a1a14,#1c0c0a);
    border-color:#5a2a22;
  }
  .building.walkup::before{
    inset:6px 4px 8px;
    background-image:
      repeating-linear-gradient(180deg,
        transparent 0 10px,
        rgba(255,190,120,.2) 10px 14px,
        transparent 14px 18px,
        rgba(80,40,30,.55) 18px 22px
      );
  }
  .building.walkup::after{
    content:"";
    position:absolute; left:2px; right:2px; top:18%; height:2px;
    background:repeating-linear-gradient(90deg, #6a3830 0 8px, transparent 8px 14px);
    box-shadow:0 22px 0 #6a3830, 0 44px 0 #6a3830;
  }

  /* chawl / long tenement */
  .building.chawl{
    width:88px; height:42%;
    background:linear-gradient(180deg,#4a2418,#24120e);
    border-color:#6a3830;
    border-radius:2px 2px 0 0;
  }
  .building.chawl::before{
    inset:7px 5px 8px;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 12px, rgba(255,210,140,.2) 12px 18px),
      repeating-linear-gradient(180deg, transparent 0 14px, rgba(255,210,140,.12) 14px 18px);
  }

  /* duplex / painted house */
  .building.duplex{
    width:40px; height:50%;
    background:linear-gradient(180deg,#5a2a18 0 45%, #2a1410 45% 100%);
    border-color:#7a4030;
  }
  .building.duplex::before{
    inset:8px 7px 10px;
    background-image:
      radial-gradient(circle at 30% 35%, rgba(255,220,140,.35) 0 4px, transparent 5px),
      radial-gradient(circle at 70% 35%, rgba(255,220,140,.25) 0 4px, transparent 5px),
      linear-gradient(180deg, transparent 55%, rgba(255,180,100,.2) 55% 78%, transparent 78%);
  }

  /* shop-front apartment */
  .building.shop{
    width:58px; height:46%;
    background:linear-gradient(180deg,#2a1820 0 55%, #3a1018 55% 100%);
    border-color:#5a2830;
  }
  .building.shop::before{
    inset:6px 5px 42%;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 8px, rgba(180,220,255,.18) 8px 12px),
      repeating-linear-gradient(180deg, transparent 0 10px, rgba(180,220,255,.12) 10px 14px);
  }
  .building.shop::after{
    content:"";
    position:absolute; left:4px; right:4px; bottom:6px; height:28%;
    background:linear-gradient(180deg, rgba(255,90,70,.35), rgba(255,160,60,.2));
    box-shadow:0 0 12px rgba(255,100,60,.25);
    border:1px solid rgba(255,180,100,.25);
  }

  /* slab block */
  .building.slab{
    width:64px; height:62%;
    background:linear-gradient(180deg,#26141a,#14080c);
    border-color:#3a2028;
  }
  .building.slab::before{
    inset:5px 4px 8px;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 6px, rgba(255,200,120,.14) 6px 9px),
      repeating-linear-gradient(180deg, transparent 0 7px, rgba(255,200,120,.12) 7px 10px);
  }

  /* water-tank roof type */
  .building.tank{
    width:36px; height:54%;
    background:linear-gradient(180deg,#301820,#180a0e);
  }
  .building.tank::after{
    content:"";
    position:absolute; left:8px; right:8px; top:-12px; height:10px;
    background:#4a3038;
    border:1px solid #6a4850;
    border-radius:2px;
    box-shadow:2px 0 0 #3a282e;
  }

  .building .roof{
    position:absolute; left:-3px; right:-3px; top:-7px; height:7px;
    background:#4a1820;
  }
  .building.antenna::after{
    content:"";
    position:absolute; left:50%; top:-20px; width:2px; height:14px;
    background:#6b3038;
    box-shadow:0 -3px 0 1px #ff7a29;
  }

  /* trees */
  .tree{
    position:relative; align-self:flex-end;
    width:18px; margin:0 28px 0 0;
  }
  .tree::before{
    content:"";
    position:absolute; left:50%; bottom:0; width:4px; height:28%;
    transform:translateX(-50%);
    background:#2a1810;
  }
  .tree::after{
    content:"";
    position:absolute; left:50%; bottom:18%;
    width:34px; height:34px;
    transform:translateX(-50%);
    border-radius:50% 50% 45% 45%;
    background:
      radial-gradient(circle at 35% 35%, #1f4a28, #0d2a14 70%);
    box-shadow:0 0 0 1px #0a1f10;
  }
  .tree.tall::after{ width:42px; height:46px; bottom:22%; }
  .tree.bush::after{ width:26px; height:22px; bottom:8%; border-radius:50%; }
  .tree.palm::after{
    width:8px; height:28px; bottom:24%; border-radius:40%;
    background:#163820;
    box-shadow:
      -12px 4px 0 -2px #163820,
      12px 4px 0 -2px #163820,
      -8px -6px 0 -3px #1a4526,
      8px -6px 0 -3px #1a4526;
  }

  /* streetlights — sparse */
  .streetlight{
    position:relative; align-self:flex-end;
    width:20px; height:100%;
    margin:0 180px 0 0;
  }
  .streetlight::before{
    content:"";
    position:absolute; left:50%; bottom:0;
    width:3px; height:78%;
    transform:translateX(-50%);
    background:linear-gradient(180deg, #5a6068, #2a2e34);
  }
  .streetlight::after{
    content:"";
    position:absolute; left:50%; bottom:78%;
    width:28px; height:3px;
    transform:translateX(-8px);
    background:#4a5058;
    border-radius:2px;
  }
  .streetlight .lamp{
    position:absolute; left:50%; bottom:calc(78% + 1px);
    width:10px; height:8px;
    transform:translateX(8px);
    border-radius:2px 2px 4px 4px;
    background:#ffe7a0;
    box-shadow:0 0 10px 3px rgba(255,210,100,.75), 0 0 24px 8px rgba(255,180,60,.28);
    animation:lampFlicker 3.2s ease-in-out infinite;
  }
  .streetlight .glow{
    position:absolute; left:50%; bottom:0;
    width:70px; height:70%;
    transform:translateX(-10px);
    background:linear-gradient(180deg, rgba(255,210,120,.22), transparent 70%);
    clip-path:polygon(40% 0, 60% 0, 100% 100%, 0 100%);
    opacity:.55;
  }
  .streetlight:nth-child(odd) .lamp{ animation-delay:.6s; }
  @keyframes lampFlicker{
    0%,100%{ opacity:1; filter:brightness(1); }
    46%{ opacity:1; }
    50%{ opacity:.72; filter:brightness(.85); }
    54%{ opacity:1; }
  }

  /* ground edge under scenery */
  .roadside{
    position:fixed; left:0; right:0; bottom:26vh; height:10px; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, #3a141a, #2a0810);
    border-top:1px solid #5a2028;
  }

  /* ---------- scrolling road (page footer strip) ---------- */
  .road{
    position:fixed; left:0; right:0; bottom:0; height:26vh; z-index:2; pointer-events:none;
    background:linear-gradient(180deg,#2a0810 0%, #1a0509 100%);
    border-top:2px solid #6b1a24;
  }
  .road::before{
    content:"";
    position:absolute; top:12%; left:0; right:0; height:6px;
    background-image:repeating-linear-gradient(90deg, var(--truck-yellow) 0 60px, transparent 60px 120px);
    animation:roadmove 1.1s linear infinite;
    opacity:.85;
  }
  @keyframes roadmove{ from{background-position-x:0;} to{background-position-x:120px;} }
  body.cruising .road::before{ animation-duration:.65s; }

  /* ---------- top jhalar / bunting tassels ---------- */
  .jhalar{
    position:relative; z-index:5;
    display:flex; justify-content:center; gap:6px;
    padding-top:10px; overflow:hidden;
  }
  .tassel{
    width:16px; height:16px; border-radius:50%;
    transform-origin:top center;
    animation:sway 2.4s ease-in-out infinite;
    box-shadow:0 10px 0 -6px rgba(0,0,0,.4);
  }
  .tassel::before{
    content:""; position:absolute; top:-9px; left:50%; width:1px; height:9px;
    background:#5b5147; transform:translateX(-50%);
  }
  .tassel:nth-child(3n){background:var(--truck-red); animation-delay:.1s;}
  .tassel:nth-child(3n+1){background:var(--truck-yellow); animation-delay:.4s;}
  .tassel:nth-child(3n+2){background:var(--neon-tube); animation-delay:.7s;}
  @keyframes sway{
    0%,100%{ transform:rotate(-8deg); }
    50%{ transform:rotate(8deg); }
  }

  /* ---------- route board ---------- */
  .routeboard{
    position:relative; z-index:5;
    max-width:420px; margin:18px auto 0; padding:8px 18px;
    background:#0c1310; border:1px solid #23361f;
    border-radius:4px;
    font-family:'Oswald',sans-serif; letter-spacing:2px; font-size:12px;
    color:var(--neon-tube); text-align:center; text-transform:uppercase;
    box-shadow:0 0 14px rgba(57,255,157,.15) inset, 0 0 8px rgba(57,255,157,.08);
  }
  .routeboard span{ display:inline-block; animation:blink 1.6s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:.35; } }

  /* ---------- hero ---------- */
  .hero{
    position:relative; z-index:5;
    text-align:center;
    padding:18px 18px 4px;
  }
  .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(2rem, 7vw, 3.6rem);
    line-height:1;
    color:var(--truck-yellow);
    -webkit-text-stroke:2px var(--truck-red);
    text-shadow:0 4px 0 rgba(0,0,0,.5), 0 0 30px rgba(255,201,60,.25);
    letter-spacing:1px;
  }
  .subtitle{
    margin-top:10px;
    font-family:'Oswald',sans-serif;
    font-size:clamp(.85rem,2.4vw,1.1rem);
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  /* ---------- tailgate quote panel ---------- */
  /* ---------- mid panel: honk only (middle) ---------- */
  .mid-panel{
    position:fixed;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    z-index:12;
    width:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    pointer-events:none;
  }
  .mid-panel .horn-zone,
  .mid-panel .horn-btn{ pointer-events:auto; }

  .tailgate-wrap,
  .tailgate,
  .quote,
  .quote-cap{ display:none !important; }

  .horn-zone{
    position:relative;
    z-index:6;
    display:flex; justify-content:center; align-items:center;
    margin:0;
  }
  .horn-hint{
    position:relative;
    text-align:center;
    margin:0;
    font-family:'Oswald',sans-serif;
    font-size:.58rem; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim);
    white-space:nowrap;
    pointer-events:none;
  }

  /* ---------- right side dashboard panels ---------- */
  .side-panel{ display:none !important; }
  .dash-card{
    background:rgba(12,16,22,.72);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    padding:12px 14px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  .dash-card h3{
    font-family:'Oswald',sans-serif;
    font-size:.68rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--truck-yellow);
    margin-bottom:6px;
  }
  .dash-card p{
    font-size:.78rem;
    line-height:1.35;
    color:var(--text-light);
  }
  .dash-card .muted{ color:var(--text-dim); font-size:.7rem; margin-top:4px; }
  .stat-row{
    display:flex; gap:8px; margin-top:4px;
  }
  .stat{
    flex:1;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px;
    padding:8px 6px;
    text-align:center;
  }
  .stat b{
    display:block;
    font-family:'Oswald',sans-serif;
    font-size:1.05rem;
    color:var(--neon-tube);
    letter-spacing:1px;
  }
  .stat span{
    font-size:.55rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
  }
  .sticker-wall{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .sticker{
    font-family:'Oswald',sans-serif;
    font-size:.58rem;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:5px 8px;
    border-radius:4px;
    border:1px solid rgba(255,255,255,.15);
    color:var(--text-light);
    background:rgba(255,77,94,.15);
  }
  .sticker.y{ background:rgba(255,201,60,.15); color:var(--truck-yellow); border-color:rgba(255,201,60,.35); }
  .sticker.g{ background:rgba(57,255,157,.1); color:var(--neon-tube); border-color:rgba(57,255,157,.3); }
  .sticker.o{ background:rgba(255,122,41,.12); color:var(--rust-orange); border-color:rgba(255,122,41,.3); }

  .milestone{
    position:fixed;
    left:50%;
    bottom:calc(26vh + min(22vh,180px));
    transform:translateX(-50%);
    z-index:3;
    pointer-events:none;
    font-family:'Oswald',sans-serif;
    font-size:.7rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(255,201,60,.75);
    text-shadow:0 2px 8px rgba(0,0,0,.6);
    white-space:nowrap;
    animation:milePulse 2.4s ease-in-out infinite;
  }
  @keyframes milePulse{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }

  .billboard-track{
    position:fixed; left:0; right:0; bottom:calc(26vh + 34vh);
    height:54px; z-index:1; pointer-events:none; overflow:hidden;
  }
  .billboards{
    display:flex; gap:80px; width:max-content;
    animation:sceneryMove 40s linear infinite;
  }
  body.cruising .billboards{ animation-duration:20s; }
  .billboard{
    flex:none;
    min-width:160px;
    padding:8px 14px;
    background:linear-gradient(180deg,#1a222c,#0e141c);
    border:2px solid var(--truck-yellow);
    border-radius:4px;
    font-family:'Oswald',sans-serif;
    font-size:.72rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-light);
    text-align:center;
    box-shadow:0 8px 16px rgba(0,0,0,.4);
  }
  .billboard small{
    display:block; margin-top:2px; font-size:.55rem; color:var(--text-dim); letter-spacing:2px;
  }

  /* ---------- truck stage (cutout on road) ---------- */
  .stage{
    position:fixed;
    left:50%;
    bottom:calc(26vh - 8px);
    transform:translateX(-50%);
    z-index:4;
    display:flex; justify-content:center; align-items:flex-end;
    width:min(47vw,410px);
    margin:0;
    height:auto;
    pointer-events:none;
  }
  .truck-wrap{
    position:relative;
    width:100%;
    animation:drivebob 1.1s ease-in-out infinite;
    transform-origin:center bottom;
  }
  .truck-img{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
    object-position:center bottom;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.55));
    transition:filter .12s ease;
    user-select:none;
    -webkit-user-drag:none;
  }
  .wheel{
    position:absolute;
    aspect-ratio:1 / 1;
    height:auto;
    border-radius:50%;
    pointer-events:none;
    animation:wheelSpin 1.1s linear infinite;
    transform-origin:50% 50%;
    will-change:transform;
    overflow:hidden;
  }
  .wheel img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }
  .wheel.w0{ left:12.877%; top:73.431%; width:12.475%; }
  .wheel.w1{ left:53.051%; top:74.161%; width:12.475%; }
  .wheel.w2{ left:68.478%; top:74.161%; width:12.475%; }
  @keyframes wheelSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  body.cruising .wheel{ animation-duration:.45s; }
  .truck-wrap.bounce{ animation:honkbounce .5s ease; }
  .truck-img.bright{
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.55)) drop-shadow(0 0 28px #fff6cf) brightness(1.18);
  }
  @keyframes drivebob{
    0%,100%{ transform:translateY(0) rotate(-0.2deg); }
    50%{ transform:translateY(-5px) rotate(0.2deg); }
  }
  @keyframes honkbounce{
    0%{ transform:translateY(0); }
    20%{ transform:translateY(-12px) rotate(-0.8deg); }
    45%{ transform:translateY(3px) rotate(0.5deg); }
    70%{ transform:translateY(-5px); }
    100%{ transform:translateY(0); }
  }

<script>
/* ---------------- tassels ---------------- */
const jhalar = document.getElementById('jhalar');
for(let i=0;i<16;i++){
  const t=document.createElement('div');
  t.className='tassel';
  t.style.animationDelay=(i*0.12)+'s';
  jhalar.appendChild(t);
}

/* ---------------- roadside scenery (looping) ---------------- */
function fillTrack(el, makeItem, count){
  const frag=document.createDocumentFragment();
  // two copies for seamless -50% loop
  for(let copy=0; copy<2; copy++){
    for(let i=0;i<count;i++){
      frag.appendChild(makeItem(i));
    }
  }
  el.appendChild(frag);
}

fillTrack(document.getElementById('skyline'), (i)=>{
  const b=document.createElement('div');
  const kinds=['tower','walkup','chawl','duplex','shop','slab','tank','walkup','tower','shop'];
  const kind=kinds[i%kinds.length];
  b.className='building '+kind+(i%2===0?' lit':'')+(kind==='tower' && i%3===0?' antenna':'');
  if(kind==='chawl' || kind==='duplex' || kind==='slab'){
    const roof=document.createElement('div');
    roof.className='roof';
    b.appendChild(roof);
  }
  return b;
}, 14);

fillTrack(document.getElementById('trees'), (i)=>{
  const t=document.createElement('div');
  const kinds=['','tall','bush','palm','','tall','bush'];
  t.className='tree '+(kinds[i%kinds.length]||'');
  return t;
}, 12);

fillTrack(document.getElementById('lights'), (i)=>{
  const s=document.createElement('div');
  s.className='streetlight';
  const lamp=document.createElement('div');
  lamp.className='lamp';
  const glow=document.createElement('div');
  glow.className='glow';
  s.appendChild(lamp);
  s.appendChild(glow);
  return s;
}, 4);

/* ---------------- scrolling billboards ---------------- */
(function(){
  const board=document.getElementById('billboards');
  if(!board) return;
  const signs=[
    ['Shyam Dhaba','Open 24 Hours'],
    ['Diesel · 50m','HP Pump'],
    ['Horn OK Please','NH-44 Rules'],
    ['Punjabi Rasoi','Next Left'],
    ['Rest Stop','Clean Washrooms'],
    ['Blessed Journey','Drive Safe']
  ];
  const frag=document.createDocumentFragment();
  for(let copy=0; copy<2; copy++){
    signs.forEach(([t,s])=>{
      const el=document.createElement('div');
      el.className='billboard';
      el.innerHTML=t+'<small>'+s+'</small>';
      frag.appendChild(el);
    });
  }
  board.appendChild(frag);
})();

/* ---------------- trip computer tick ---------------- */
(function(){
  let km=428;
  setInterval(()=>{
    const cruising=document.body.classList.contains('cruising');
    if(cruising) km += Math.random()>.6 ? 1 : 0;
    const mile=document.getElementById('milestone');
    if(mile) mile.textContent='NH-44 · KM '+km+' · NEXT DHABA '+(12-(km%12))+' KM';
  }, 1200);
})();

/* ---------------- rotating tailgate quotes (removed) ---------------- */

/* ---------------- horn interaction ---------------- */
let audioCtx=null;
function ensureCtx(){
  if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playHorn(){
  const ctx=ensureCtx();
  const now=ctx.currentTime;
  [370,466].forEach((freq,i)=>{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sawtooth';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,now);
    gain.gain.linearRampToValueAtTime(0.14,now+0.03);
    gain.gain.linearRampToValueAtTime(0.12,now+0.42);
    gain.gain.linearRampToValueAtTime(0,now+0.55);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now+0.58);
  });
}

const stage=document.getElementById('stage');
const truckWrap=document.getElementById('truckWrap');
const truckImg=document.getElementById('truckImg');
const ring1=document.getElementById('ring1');
const ring2=document.getElementById('ring2');

/* Keep spinning wheel overlays locked to tire centers */
function layoutWheels(){
  if(!truckImg || !truckImg.naturalWidth) return;
  const nw=truckImg.naturalWidth;
  const nh=truckImg.naturalHeight;
  const rw=truckImg.clientWidth;
  const rh=truckImg.clientHeight;
  const ox=truckImg.offsetLeft;
  const oy=truckImg.offsetTop;
  document.querySelectorAll('.wheel').forEach((el)=>{
    const cx=parseFloat(el.dataset.cx);
    const cy=parseFloat(el.dataset.cy);
    const r=parseFloat(el.dataset.r);
    const size=(2*r/nw)*rw;
    el.style.left=(ox + ((cx-r)/nw)*rw)+'px';
    el.style.top=(oy + ((cy-r)/nh)*rh)+'px';
    el.style.width=size+'px';
    el.style.height=size+'px';
  });
}
truckImg.addEventListener('load', layoutWheels);
window.addEventListener('resize', layoutWheels);
if(truckImg.complete) layoutWheels();

function honk(){
  playHorn();
  truckWrap.classList.remove('bounce'); void truckWrap.offsetWidth; truckWrap.classList.add('bounce');
  truckImg.classList.add('bright');
  setTimeout(()=>{
    truckImg.classList.remove('bright');
    truckWrap.classList.remove('bounce');
  },500);
  [ring1,ring2].forEach((r,i)=>{
    r.classList.remove('play'); void r.offsetWidth;
    setTimeout(()=>r.classList.add('play'), i*120);
  });
}
document.getElementById('hornBtn').addEventListener('click', honk);
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space'){ e.preventDefault(); honk(); }
});

/* ---------------- YouTube playlist player ---------------- */
const PLAYLIST_ID = 'PLNJnjOy87PU8';
const PLAYLIST_TITLE = '2000s Music';

const trackName = document.getElementById('trackName');
const trackArtist = document.getElementById('trackArtist');
const progressFill = document.getElementById('progressFill');
const progressBar = document.getElementById('progressBar');
const curTimeEl = document.getElementById('curTime');
const totTimeEl = document.getElementById('totTime');
const disc = document.getElementById('disc');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let ytPlayer = null;
let playing = false;
let progressTimer = null;
let ready = false;
let pendingPlay = false;
let skipTries = 0;

function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

function setPlayIcon(isPlaying) {
  const icon = document.getElementById('playIcon');
  if (!icon) return;
  icon.outerHTML = isPlaying
    ? '<svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>'
    : '<svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}

function setPlayingUI(isPlaying) {
  playing = isPlaying;
  setPlayIcon(isPlaying);
  disc.classList.toggle('spinning', isPlaying);
  stage.classList.toggle('cruising', isPlaying);
  document.body.classList.toggle('cruising', isPlaying);
}

function updateTrackMeta() {
  if (!ytPlayer || typeof ytPlayer.getVideoData !== 'function') return;
  try {
    const data = ytPlayer.getVideoData() || {};
    trackName.textContent = data.title || PLAYLIST_TITLE;
    trackArtist.textContent = (data.author ? data.author + ' · ' : '') + 'YouTube Playlist';
    const vid = data.video_id;
    if (vid) {
      let thumb = disc.querySelector('img');
      if (!thumb) {
        thumb = document.createElement('img');
        thumb.alt = '';
        disc.prepend(thumb);
      }
      thumb.src = 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg';
    }
    const dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
    if (dur) totTimeEl.textContent = fmt(dur);
  } catch (err) {}
}

function tickProgress() {
  if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
  try {
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    curTimeEl.textContent = fmt(cur);
    if (dur) totTimeEl.textContent = fmt(dur);
    progressFill.style.width = (dur ? (cur / dur * 100) : 0) + '%';
  } catch (err) {}
}

function startProgress() {
  clearInterval(progressTimer);
  progressTimer = setInterval(tickProgress, 400);
  tickProgress();
}

function stopProgress() {
  clearInterval(progressTimer);
  progressTimer = null;
}

function playOrPause() {
  if (!ytPlayer || !ready) {
    pendingPlay = true;
    trackArtist.textContent = 'Loading YouTube…';
    return;
  }
  try {
    const state = ytPlayer.getPlayerState();
    const S = window.YT.PlayerState;
    if (state === S.PLAYING || state === S.BUFFERING) {
      ytPlayer.pauseVideo();
    } else if (state === S.CUED || state === S.UNSTARTED || state === -1) {
      // Ensure playlist is queued, then play
      try {
        ytPlayer.loadPlaylist({
          listType: 'playlist',
          list: PLAYLIST_ID,
          index: 0
        });
      } catch (err) {
        ytPlayer.playVideo();
      }
    } else {
      ytPlayer.playVideo();
    }
  } catch (err) {
    trackArtist.textContent = 'Could not start · try again';
  }
}

function onPlayerReady() {
  ready = true;
  trackArtist.textContent = 'YouTube Playlist · Ready';
  updateTrackMeta();
  tickProgress();
  if (pendingPlay) {
    pendingPlay = false;
    setTimeout(function () {
      try {
        ytPlayer.loadPlaylist({
          listType: 'playlist',
          list: PLAYLIST_ID,
          index: 0
        });
      } catch (err) {
        try { ytPlayer.playVideo(); } catch (e2) {}
      }
    }, 200);
  }
}

function onPlayerStateChange(e) {
  if (!window.YT || !window.YT.PlayerState) return;
  const S = window.YT.PlayerState;
  if (e.data === S.PLAYING) {
    skipTries = 0;
    setPlayingUI(true);
    updateTrackMeta();
    startProgress();
  } else if (e.data === S.PAUSED) {
    setPlayingUI(false);
    stopProgress();
    tickProgress();
  } else if (e.data === S.ENDED) {
    setPlayingUI(false);
    stopProgress();
    tickProgress();
    updateTrackMeta();
  } else if (e.data === S.CUED || e.data === S.BUFFERING) {
    updateTrackMeta();
  }
}

function onPlayerError(e) {
  const code = e && e.data;
  console.warn('YouTube error', code);
  setPlayingUI(false);
  // 101/150 = embed blocked for that video — skip ahead
  if ((code === 101 || code === 150 || code === 100) && skipTries < 8) {
    skipTries += 1;
    trackArtist.textContent = 'Skipping blocked track…';
    try { ytPlayer.nextVideo(); } catch (err) {}
    return;
  }
  trackArtist.textContent = 'Playback error · open playlist link below';
}

function createPlayer() {
  if (ytPlayer || !window.YT || !window.YT.Player) return;
  if (!document.getElementById('ytPlayer')) return;

  if (window.location.protocol === 'file:') {
    trackArtist.textContent = 'Open http://localhost:8765 (not file://)';
    return;
  }

  ytPlayer = new YT.Player('ytPlayer', {
    width: 200,
    height: 112,
    playerVars: {
      listType: 'playlist',
      list: PLAYLIST_ID,
      autoplay: 0,
      controls: 0,
      rel: 0,
      modestbranding: 1,
      playsinline: 1,
      enablejsapi: 1,
      origin: window.location.origin
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange,
      onError: onPlayerError
    }
  });
}

function loadYouTubeApi() {
  if (window.location.protocol === 'file:') {
    trackArtist.textContent = 'Open http://localhost:8765 to play';
    return;
  }
  if (window.YT && window.YT.Player) {
    createPlayer();
    return;
  }
  window.onYouTubeIframeAPIReady = function () { createPlayer(); };
  if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.async = true;
    document.head.appendChild(tag);
  }
  setTimeout(function () {
    if (!ready) trackArtist.textContent = 'Still loading… refresh on localhost:8765';
  }, 8000);
}

playBtn.addEventListener('click', playOrPause);
prevBtn.addEventListener('click', function () {
  if (!ytPlayer || !ready) return;
  try { ytPlayer.previousVideo(); } catch (err) {}
});
nextBtn.addEventListener('click', function () {
  if (!ytPlayer || !ready) return;
  try { ytPlayer.nextVideo(); } catch (err) {}
});

progressBar.addEventListener('click', function (e) {
  if (!ytPlayer || !ready) return;
  try {
    const dur = ytPlayer.getDuration();
    if (!dur) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    ytPlayer.seekTo(pct * dur, true);
    tickProgress();
  } catch (err) {}
});

loadYouTubeApi();
</script>
</body>
</html>
